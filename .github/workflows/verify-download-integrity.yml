name: Verify OTA Download Integrity
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-download-integrity.yml
      - approved-downloads.json
      - tools/verify_downloads.py
      - tests/test_verify_downloads.py
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-download-integrity.yml
      - approved-downloads.json
      - tools/verify_downloads.py
      - tests/test_verify_downloads.py
  schedule:
    - cron: "21 10 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-downloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test integrity verifier fail-closed behavior
        run: python3 -m unittest discover -s tests -v
      - name: Verify approved public and Render downloads and immutable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -u tools/verify_downloads.py
      - name: Preserve concise integrity report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ota-download-report-${{ github.run_id }}
          path: ota-download-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize each verified asset or failed endpoint
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('ota-download-report.json')
          if not path.exists():
              raise SystemExit('Integrity report missing; inspect preceding failure')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('| Result | Role | Asset | Detail |\n|---|---|---|---|\n')
              for row in json.loads(path.read_text()):
                  detail = row.get('error', 'Public/proxy bytes, SHA-256, header and immutability verified')
                  if 'checking_url' in row:
                      detail += ': ' + row['checking_url']
                  out.write(f"| {row['status']} | {row['role']} | {row['asset']} | {detail} |\n")
          PY
